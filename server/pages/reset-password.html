<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password · PrognosEd</title>
  <style>
    :root {
      --navy: #2c3546;
      --ink: #101828;
      --muted: #475467;
      --line: #e4e7ec;
      --brand: #0b6e4f;
      --danger: #b42318;
      --danger-bg: #fef3f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--navy);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 18px 40px rgba(0,0,0,.28);
    }
    h1 { margin: 0; font-size: 1.5rem; }
    p.lead { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .email {
      margin-top: 20px;
      background: #e6f4ee;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
    }
    label { display: block; margin: 16px 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
    }
    input:focus { outline: 2px solid var(--brand); border-color: var(--brand); }
    button {
      margin-top: 20px;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      background: var(--brand);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .alert { margin-top: 16px; border-radius: 10px; padding: 12px; font-size: 14px; line-height: 1.45; }
    .alert.error { background: var(--danger-bg); color: var(--danger); }
    .alert.ok { background: #e6f4ee; color: var(--brand); }
    .hint { margin-top: 10px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <p style="margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);">PrognosEd</p>
    <h1>Choose a new password</h1>
    <p class="lead">This link can be used once and expires shortly after it was sent.</p>
    <div id="status" class="alert" hidden></div>
    <form id="form" hidden>
      <div id="email" class="email"></div>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters" />
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Re-enter password" />
      <p class="hint">Use at least 8 characters.</p>
      <button type="submit" id="submit">Update password</button>
    </form>
  </main>
  <script>
    const statusEl = document.getElementById('status')
    const form = document.getElementById('form')
    const emailEl = document.getElementById('email')
    const submitBtn = document.getElementById('submit')
    const token = new URLSearchParams(window.location.search).get('token')

    function showStatus(message, kind) {
      statusEl.hidden = false
      statusEl.className = 'alert ' + kind
      statusEl.textContent = message
    }

    async function load() {
      if (!token) {
        showStatus('This reset link is missing a token. Return to sign in and request a new one.', 'error')
        return
      }
      try {
        const response = await fetch('/api/auth/reset/' + encodeURIComponent(token))
        const payload = await response.json()
        if (!response.ok) throw new Error(payload.error?.message || 'This reset link is invalid or has expired.')
        emailEl.textContent = payload.data.email
        form.hidden = false
      } catch (error) {
        showStatus(error.message || 'This reset link is invalid or has expired.', 'error')
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault()
      const password = document.getElementById('password').value
      const confirmPassword = document.getElementById('confirm').value
      if (password.length < 8) {
        showStatus('Password must be at least 8 characters.', 'error')
        return
      }
      if (password !== confirmPassword) {
        showStatus('Passwords do not match.', 'error')
        return
      }
      submitBtn.disabled = true
      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password, confirmPassword }),
        })
        const payload = await response.json()
        if (!response.ok) throw new Error(payload.error?.message || 'Unable to update password.')
        form.hidden = true
        showStatus('Password updated. You can now sign in with your new password.', 'ok')
      } catch (error) {
        showStatus(error.message, 'error')
        submitBtn.disabled = false
      }
    })

    load()
  </script>
</body>
</html>
